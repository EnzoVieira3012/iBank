spring:
  application:
    name: ibank-api-test
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///ibank_test
    username: test
    password: test
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false
  sql:
    init:
      mode: always

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    com.ibank: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

app:
  jwt:
    secret: test-secret-key-for-testing-only-min-256-bits-long
    expiration: 3600000
  security:
    bcrypt-strength: 4
    rate-limit:
      requests: 1000
      window-seconds: 60