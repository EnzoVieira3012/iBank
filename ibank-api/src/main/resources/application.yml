server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: ibank-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ibank}
    username: ${DB_USER:ibank}
    password: ${DB_PASSWORD:ibank}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:true}
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 20
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 0
    validate-on-migrate: true
  sql:
    init:
      mode: never

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
    display-request-duration: true
    filter: true
    try-it-out-enabled: true
    persist-authorization: true
    operations-sorter: alpha
    tags-sorter: alpha
    doc-expansion: none
  packages-to-scan: com.ibank.api.controller
  paths-to-match: /api/v1/**
  version: 1.0.0
  title: iBank API
  description: Complete banking API with full Swagger testing

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE:health,info,metrics,prometheus,auditevents}
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:always}
      probes:
        enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.ibank: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: ${JPA_SHOW_SQL:false}
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

app:
  jwt:
    secret: ${JWT_SECRET:super-secret-change-in-production-min-256-bits-long}
    expiration: ${JWT_EXPIRATION:86400000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  security:
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
    rate-limit:
      requests: ${RATE_LIMIT_REQUESTS:100}
      window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
  pix:
    dict-mock-enabled: ${PIX_DICT_MOCK_ENABLED:true}
    qrcode-expiration-seconds: ${PIX_QRCODE_EXPIRATION_SECONDS:3600}
  fees:
    table-version: ${FEE_TABLE_VERSION:2024.01}
  antifraud:
    enabled: ${ANTIFRAUD_ENABLED:true}
    scoring-threshold: ${ANTIFRAUD_SCORING_THRESHOLD:70}
  audit:
    partition-months: ${AUDIT_PARTITION_MONTHS:60}
    retention-years: ${AUDIT_RETENTION_YEARS:5}

---

spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///ibank
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  sql:
    init:
      mode: always

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    root: WARN
    com.ibank: DEBUG