server:
  port: 8085

spring:
  application:
    name: ibank-reconciliation
  datasource:
    url: jdbc:postgresql://localhost:5432/ibank_reconciliation
    username: ${DB_USER:ibank}
    password: ${DB_PASSWORD:ibank}
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

ibank:
  reconciliation:
    daily-job-type: DAILY_SETTLEMENT
    source-system: core-banking
    target-system: general-ledger
    daily-cron: "0 0 2 * * ?"

logging:
  level:
    com.ibank.reconciliation: DEBUG
    org.springframework.batch: INFO
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"