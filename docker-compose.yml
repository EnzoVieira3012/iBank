version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ibank-db
    environment:
      POSTGRES_DB: ibank
      POSTGRES_USER: ibank
      POSTGRES_PASSWORD: ibank
    ports:
      - "5432:5432"
    volumes:
      - ibank_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibank -d ibank"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ibank-network

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: ibank-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ibank.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - ibank_pgadmin:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - ibank-network

volumes:
  ibank_pgdata:
  ibank_pgadmin:

networks:
  ibank-network:
    driver: bridge