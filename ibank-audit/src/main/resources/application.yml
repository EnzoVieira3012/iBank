server:
  port: 8084

spring:
  application:
    name: ibank-audit
  datasource:
    url: jdbc:postgresql://localhost:5432/ibank_audit
    username: ${DB_USER:ibank}
    password: ${DB_PASSWORD:ibank}
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

ibank:
  audit:
    checksum:
      secret: ${AUDIT_CHECKSUM_SECRET:change-me-in-production-min-32-chars}
    retention:
      cron: "0 0 2 * * ?"
      enabled: true

logging:
  level:
    com.ibank.audit: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"